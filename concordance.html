<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>தொடரடைவு — தொல்காப்பியம்</title>

<style>
    body {
        font-family: system-ui, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
        line-height: 1.7;
    }

    h1 {
        margin-bottom: 0.5rem;
    }

    button {
        margin: 0.2rem;
        padding: 0.35rem 0.6rem;
        cursor: pointer;
    }

    button.active {
        font-weight: bold;
    }

    .word {
        display: inline-block;
        margin: 0.2rem 0.4rem 0.2rem 0;
    }

    .occurrence {
        padding: 0.8rem 0;
        border-bottom: 1px solid #ddd;
    }

    .location {
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        color: #555;
    }

    .global-number {
        font-weight: bold;
        margin-right: 0.3rem;
    }

    .kwic {
        font-family: serif;
        font-size: 1.05rem;
        margin: 0.4rem 0;
    }

    .kwic mark {
        font-weight: bold;
    }

    .full-text {
        color: #555;
        font-family: serif;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<h1>தொடரடைவு</h1>

<div id="stats"></div>

<div id="initials"></div>

<hr>

<div id="words"></div>

<hr>

<div id="occurrences"></div>

<script>
const tamilOrder = [
    "அ", "ஆ", "இ", "ஈ", "உ", "ஊ", "எ", "ஏ", "ஐ",
    "ஒ", "ஓ", "ஔ",
    "க", "ங", "ச", "ஞ", "ட", "ண", "த", "ந",
    "ப", "ம", "ய", "ர", "ல", "வ", "ழ", "ள", "ற", "ன"
];

const SUTRA_BASE =
    "https://sundararajana.github.io/tolkappiyam/?song_no=";

let concordance = {};
let currentInitial = null;
let currentWord = null;


fetch("concordance.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to load concordance.json");
        }
        return response.json();
    })
    .then(data => {
        concordance = data;

        const wordCount = Object.keys(concordance).length;
        const occurrenceCount =
            Object.values(concordance)
                .reduce((sum, occurrences) => sum + occurrences.length, 0);

        document.getElementById("stats").textContent =
            `${wordCount} சொற்கள் · ${occurrenceCount} occurrences`;

        showInitials();
    })
    .catch(error => {
        console.error(error);
        document.getElementById("stats").textContent =
            "தொடரடைவுத் தரவை ஏற்ற முடியவில்லை.";
    });


function showInitials() {
    const container = document.getElementById("initials");
    container.innerHTML = "";

    for (const initial of tamilOrder) {
        const button = document.createElement("button");
        button.textContent = initial;

        button.onclick = () => {
            currentInitial = initial;
            currentWord = null;

            showWords(initial);
            document.getElementById("occurrences").innerHTML = "";
        };

        container.appendChild(button);
    }
}


function showWords(initial) {
    const container = document.getElementById("words");
    container.innerHTML = "";

    const words = Object.keys(concordance)
        .filter(word => word.startsWith(initial))
        .sort((a, b) => a.localeCompare(b, "ta"));

    for (const word of words) {
        const button = document.createElement("button");
        button.className = "word";

        button.textContent =
            `${word} (${concordance[word].length})`;

        button.onclick = () => {
            currentWord = word;
            showOccurrences(word);
        };

        container.appendChild(button);
    }
}


function showOccurrences(word) {
    const container = document.getElementById("occurrences");
    container.innerHTML = "";

    const occurrences = concordance[word];

    for (const occurrence of occurrences) {
        const div = document.createElement("div");
        div.className = "occurrence";

        const link = document.createElement("a");

        link.href =
            SUTRA_BASE +
            encodeURIComponent(occurrence.global_noorpa);

        link.target = "_blank";

        const location = document.createElement("div");
        location.className = "location";

        location.innerHTML =
            `<span class="global-number">${occurrence.global_noorpa}</span>` +
            ` · ${occurrence.adhikaaram}` +
            ` · ${occurrence.iyal_name}` +
            ` · இயல் ${occurrence.iyal}` +
            ` · நூற்பா ${occurrence.noorpa}`;

        link.appendChild(location);


        const kwic = document.createElement("div");
        kwic.className = "kwic";

        kwic.innerHTML = makeKwic(
            occurrence.text,
            word,
            occurrence.paadal_position
        );

        link.appendChild(kwic);


        const fullText = document.createElement("div");
        fullText.className = "full-text";

        fullText.textContent = occurrence.text;

        link.appendChild(fullText);

        div.appendChild(link);
        container.appendChild(div);
    }
}


function makeKwic(text, word, position) {
    const words = tokenize(text);

    const context = 5;

    const start = Math.max(0, position - context);
    const end = Math.min(words.length, position + context + 1);

    const before = words.slice(start, position).join(" ");
    const after = words.slice(position + 1, end).join(" ");

    return (
        `${start > 0 ? "... " : ""}` +
        `${escapeHtml(before)} ` +
        `<mark>${escapeHtml(words[position])}</mark> ` +
        `${escapeHtml(after)}` +
        `${end < words.length ? " ..." : ""}`
    );
}

function tokenize(text) {
    return text.normalize("NFC")
        .match(/[\u0B80-\u0BFF]+/g) || [];
}


function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
</script>

</body>
</html>
