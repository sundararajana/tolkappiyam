<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>தொல்காப்பியம் — தொடரடைவு</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Noto Sans Tamil",
                   "Noto Sans", sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5em;
    }

    #stats {
      text-align: center;
      color: #666;
      margin-bottom: 1.5em;
    }

    #letters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }

    #letters button {
      font: inherit;
      min-width: 38px;
      padding: 5px 8px;
      cursor: pointer;
    }

    #wordIndex {
      column-width: 220px;
      column-gap: 30px;
    }

    .word {
      break-inside: avoid;
      display: flex;
      justify-content: space-between;
      padding: 2px 4px;
      cursor: pointer;
    }

    .word:hover {
      background: #eee;
    }

    .count {
      color: #777;
      font-size: 0.9em;
      margin-left: 10px;
    }

    #occurrences {
      margin-top: 30px;
    }

    .occurrence {
      border-top: 1px solid #ddd;
      padding: 12px 4px;
    }

    .location {
      color: #666;
      font-size: 0.9em;
    }

    .context {
      margin-top: 4px;
      font-size: 1.1em;
    }

    .context a {
      color: inherit;
      text-decoration: none;
    }

    .context a:hover {
      text-decoration: underline;
    }

    .selected-word {
      font-weight: bold;
    }

    .back {
      margin-top: 15px;
    }

    .back a {
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>தொடரடைவு</h1>

  <div id="stats"></div>

  <div id="letters"></div>

  <div id="wordIndex"></div>

  <div id="occurrences"></div>

  <script>
    const SUTRA_BASE =
      "https://sundararajana.github.io/tolkappiyam/?song_no=";

    let concordance = {};

    /*
     * Tamil alphabetical order.
     *
     * Unicode sorting is not the same thing as traditional
     * Tamil alphabetical ordering, so define the order explicitly.
     */
    const tamilOrder = [
      "அ", "ஆ", "இ", "ஈ", "உ", "ஊ", "எ", "ஏ", "ஐ",
      "ஒ", "ஓ", "ஔ",
      "க", "ங", "ச", "ஞ", "ட", "ண", "த", "ந",
      "ப", "ம", "ய", "ர", "ல", "வ", "ழ", "ள", "ற", "ன"
    ];

    /*
     * Get the first Tamil base character.
     *
     * For a word beginning with a vowel or consonant, the first
     * code point is sufficient for the current corpus.
     */
    function initial(word) {
      return [...word][0];
    }

    /*
     * Sort words using Tamil initial order, followed by
     * Unicode/locale comparison.
     */
    function sortWords(words) {
      return words.sort((a, b) => {
        const ia = tamilOrder.indexOf(initial(a));
        const ib = tamilOrder.indexOf(initial(b));

        if (ia !== ib) {
          return ia - ib;
        }

        return a.localeCompare(b, "ta");
      });
    }

    async function loadConcordance() {
      const response = await fetch("concordance.json");

      if (!response.ok) {
        throw new Error(
          `Could not load concordance.json (${response.status})`
        );
      }

      concordance = await response.json();

      const words = Object.keys(concordance);
      const occurrences = words.reduce(
        (sum, word) => sum + concordance[word].length,
        0
      );

      document.getElementById("stats").textContent =
        `${words.length.toLocaleString("ta-IN")} சொற்கள் · ` +
        `${occurrences.toLocaleString("ta-IN")} பதிவுகள்`;

      buildLetterButtons();
      showWords(tamilOrder[0]);
    }

    function buildLetterButtons() {
      const container = document.getElementById("letters");

      for (const letter of tamilOrder) {
        const words = Object.keys(concordance)
          .filter(word => initial(word) === letter);

        if (words.length === 0) {
          continue;
        }

        const button = document.createElement("button");
        button.textContent = letter;
        button.title = `${words.length} சொற்கள்`;

        button.addEventListener("click", () => {
          showWords(letter);
        });

        container.appendChild(button);
      }
    }

    function showWords(letter) {
      const container = document.getElementById("wordIndex");
      const occurrences = document.getElementById("occurrences");

      occurrences.innerHTML = "";

      let words = Object.keys(concordance)
        .filter(word => initial(word) === letter);

      words = sortWords(words);

      container.innerHTML = "";

      for (const word of words) {
        const div = document.createElement("div");
        div.className = "word";

        const wordSpan = document.createElement("span");
        wordSpan.textContent = word;

        const countSpan = document.createElement("span");
        countSpan.className = "count";
        countSpan.textContent =
          concordance[word].length.toLocaleString("ta-IN");

        div.appendChild(wordSpan);
        div.appendChild(countSpan);

        div.addEventListener("click", () => {
          showOccurrences(word);
        });

        container.appendChild(div);
      }
    }

    function showOccurrences(word) {
      const container = document.getElementById("occurrences");

      container.innerHTML = "";

      const heading = document.createElement("h2");
      heading.textContent =
        `${word} — ${concordance[word].length.toLocaleString("ta-IN")} இடங்கள்`;

      container.appendChild(heading);

      for (const occurrence of concordance[word]) {
        const div = document.createElement("div");
        div.className = "occurrence";

        const location = document.createElement("div");
        location.className = "location";

        location.textContent =
          `${occurrence.adhikaaram} · ` +
          `${occurrence.iyal_name} · ` +
          `இயல் ${occurrence.iyal} · ` +
          `நூற்பா ${occurrence.noorpa}`;

        div.appendChild(location);

        const context = document.createElement("div");
        context.className = "context";

        const link = document.createElement("a");

        link.href =
          SUTRA_BASE + encodeURIComponent(occurrence.global_noorpa);

        link.textContent = occurrence.text;

        context.appendChild(link);
        div.appendChild(context);

        container.appendChild(div);
      }

      container.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    loadConcordance().catch(error => {
      console.error(error);

      document.getElementById("stats").textContent =
        "தொடரடைவுத் தரவை ஏற்ற முடியவில்லை.";
    });
  </script>

</body>
</html>
